const exerciseFamilyById = (id) => EXERCISES.find(e=>e.id===id);
const isUnlockedForLevel = (fam, levelId) => {
  if (!fam.minLevel) return true;
  const order = ['beginner','intermediate','advanced'];
  return order.indexOf(levelId) >= order.indexOf(fam.minLevel);
};
const resolveExercise = (id, levelId, customList=[]) => {
  const custom = customList.find(c=>c.id===id);
  if (custom) return { ...custom };
  const fam = exerciseFamilyById(id);
  if (!fam) return null;
  const v = fam.variants[levelId] || fam.variants.intermediate || fam.variants.beginner;
  return { id:fam.id, bodyPart:fam.bodyPart, icon:fam.icon, minLevel:fam.minLevel, ...v };
};

const WEEKDAY = ['日','月','火','水','木','金','土'];
const toDateStr = (d) => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const formatFriendly = (dateStr) => {
  const [y,m,d] = dateStr.split('-').map(Number);
  const dt = new Date(y, m-1, d);
  return `${m}/${d}(${WEEKDAY[dt.getDay()]})`;
};
const findPreviousLog = (workouts, exerciseId) => {
  for (const w of workouts) {
    const log = w.exercises.find(e => e.exerciseId === exerciseId);
    if (log && log.sets && log.sets.length > 0) return { date: w.date, sets: log.sets };
  }
  return null;
};
const formatSetsSummary = (sets, unit) => sets.map(s => s.weight > 0 ? `${s.weight}kg×${s.value}${unit}` : `${s.value}${unit}`).join('・');
const calcStreak = (workouts) => {
  const dateSet = new Set(workouts.map(w=>w.date));
  let streak = 0;
  let cursor = new Date();
  if (!dateSet.has(toDateStr(cursor))) cursor.setDate(cursor.getDate()-1);
  while (dateSet.has(toDateStr(cursor))) { streak++; cursor.setDate(cursor.getDate()-1); }
  return streak;
};
const last7Days = (workouts) => {
  const dateSet = new Set(workouts.map(w=>w.date));
  const days = [];
  for (let i=6;i>=0;i--){
    const d = new Date(); d.setDate(d.getDate()-i);
    const ds = toDateStr(d);
    days.push({ date:ds, done:dateSet.has(ds), label:WEEKDAY[d.getDay()] });
  }
  return days;
};

async function fetchEncouragement(summaryText) {
  try {

      method: "POST",

      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: 1000,
        messages: [{ role:"user", content:
          `あなたは運動が苦手な初心者にやさしく寄り添うパーソナルトレーナーです。以下のトレーニング記録に対して、やさしく短い応援メッセージを日本語で1〜2文だけ、絵文字を1つ程度使って書いてください。メッセージ本文だけを返し、前置きや説明は書かないでください。\n\n記録: ${summaryText}` }]
      })
    });
    const data = await response.json();
    const text = (data.content||[]).map(b=>b.text||'').join('').trim();

function Stepper({ value, onChange, step=1, min=0, unit }) {
  const [text, setText] = useState(String(value));
  useEffect(() => { setText(String(value)); }, [value]);

  const handleType = (e) => {
    const raw = e.target.value;
    setText(raw);
    if (raw === '') return;
    const v = parseFloat(raw);
    if (!isNaN(v)) onChange(v);
  };
  const handleBlur = () => {
    if (text === '' || isNaN(parseFloat(text))) {
      setText(String(min));
      onChange(min);
    }
  };
  return (
    <div className="flex items-center justify-center gap-4">
      <button onClick={()=>onChange(Math.max(min, value-step))}
        className="w-12 h-12 rounded-2xl bg-white border-2 border-forest-100 text-forest-600 text-xl font-bold soft-shadow active:scale-95 transition-transform">−</button>
      <div className="w-24 text-center flex items-center justify-center gap-1">

  );
}

const REST_SET = 60, REST_EXERCISE = 60;

function SessionView({ routine, level, customExercises, workouts, onCancel, onSave }) {
  const [exercises, setExercises] = useState(routine.exerciseIds.map(id=>resolveExercise(id, level, customExercises)));
  const [logs, setLogs] = useState(exercises.map(e => ({ exerciseId:e.id, name:e.name, bodyPart:e.bodyPart, icon:e.icon, unit:e.unit, sets:[] })));
  const [exIndex, setExIndex] = useState(0);
  const [setIndex, setSetIndex] = useState(0);
  const [value, setValue] = useState(exercises[0].reps);
  const [useWeight, setUseWeight] = useState(false);
  const [weight, setWeight] = useState(2);
  const [phase, setPhase] = useState('exercise'); // exercise | rest | bonus | complete
  const [showSwitcher, setShowSwitcher] = useState(false);
  const [showBonusPicker, setShowBonusPicker] = useState(false);
  const [restLeft, setRestLeft] = useState(0);
  const [restTotal, setRestTotal] = useState(REST_SET);
  const [afterRest, setAfterRest] = useState('exercise');
  const [mood, setMood] = useState(null);
  const [note, setNote] = useState('');
  const [aiMessage, setAiMessage] = useState(null);
  const [aiLoading, setAiLoading] = useState(false);
  const [timerRunning, setTimerRunning] = useState(false);
  const [timerElapsed, setTimerElapsed] = useState(0);
  const startTime = useRef(Date.now());

  const current = exercises[exIndex];
  const previous = useMemo(() => findPreviousLog(workouts, current.id), [current.id, workouts]);
  const previousBest = useMemo(() => {
    if (!previous) return null;
    return previous.sets.reduce((best, s) => {
      const effort = s.weight>0 ? s.weight*s.value : s.value;
      const bestEffort = best ? (best.weight>0 ? best.weight*best.value : best.value) : -1;
      return effort > bestEffort ? s : best;
    }, null);
  }, [previous]);
  const achievedValue = current.unit === '秒' ? timerElapsed : value;
  const currentEffort = useWeight ? weight*achievedValue : achievedValue;
  const previousEffort = previousBest ? (previousBest.weight>0 ? previousBest.weight*previousBest.value : previousBest.value) : null;
  const isBeatingPrevious = previousEffort!=null && achievedValue>0 && currentEffort > previousEffort;

  const availablePool = useMemo(() => {
    const built = EXERCISES.filter(e=>isUnlockedForLevel(e, level)).map(e=>resolveExercise(e.id, level, customExercises));
    return [...built, ...customExercises.map(e=>({ ...e }))];
  }, [level, customExercises]);

  useEffect(()=>{
    let iv;
    if (phase==='rest' && restLeft>0) {
      iv = setInterval(()=>setRestLeft(s=>{
        if (s<=1) {
          if (navigator.vibrate) navigator.vibrate([200,80,200]);
          setPhase(afterRest);
          return 0;
        }
        return s-1;
      }), 1000);
    }
    return ()=>clearInterval(iv);
  }, [phase, restLeft, afterRest]);

  const startRest = (seconds, next) => { setRestTotal(seconds); setRestLeft(seconds); setAfterRest(next); setPhase('rest'); };

  useEffect(() => { setTimerElapsed(0); setTimerRunning(false); }, [exIndex, setIndex]);

  useEffect(() => {
    let iv;
    if (timerRunning) {
      iv = setInterval(() => setTimerElapsed(t=>t+1), 1000);
    }
    return () => clearInterval(iv);
  }, [timerRunning]);

  useEffect(() => {
    if (timerRunning && current && current.unit==='秒' && timerElapsed >= value) {
      setTimerRunning(false);
      if (navigator.vibrate) navigator.vibrate([120,60,120]);
      logSet();
    }
  }, [timerElapsed]);

  const logSet = () => {
    if (navigator.vibrate) navigator.vibrate(30);
    setLogs(prev => {
      const copy = [...prev];
      copy[exIndex] = { ...copy[exIndex], sets:[...copy[exIndex].sets, { value, weight: useWeight ? weight : 0 }] };
      return copy;
    });
    const isLastSet = setIndex+1 >= current.sets;
    if (!isLastSet) {
      setSetIndex(setIndex+1);
      setValue(current.reps);
      startRest(current.restSet || REST_SET, 'exercise');
    } else {
      const isLastExercise = exIndex+1 >= exercises.length;
      if (isLastExercise) {
        setPhase('bonus');
      } else {
        startRest(current.restExercise || REST_EXERCISE, 'nextExercise');
      }
    }
  };

  useEffect(()=>{
    if (phase==='nextExercise') {
      setExIndex(i=>i+1);
      setSetIndex(0);
      setValue(exercises[exIndex+1] ? exercises[exIndex+1].reps : 10);
      setUseWeight(false);
      setPhase('exercise');
    }
  }, [phase]);

  const addSelectedExercise = (pick) => {
    setExercises(prev => [...prev, pick]);
    setLogs(prev => [...prev, { exerciseId:pick.id, name:pick.name, bodyPart:pick.bodyPart, icon:pick.icon, unit:pick.unit, sets:[] }]);
    setExIndex(exercises.length);
    setSetIndex(0);
    setValue(pick.reps);
    setUseWeight(false);
    setPhase('exercise');
    setShowBonusPicker(false);
  };

  const handleWantBonus = () => {
    const pool = availablePool.filter(e => !exercises.find(x=>x.id===e.id));
    if (pool.length===0) { finishNow(); return; }
    setShowBonusPicker(true);
  };

  const jumpToExercise = (i) => {
    setExIndex(i);
    const doneSets = logs[i].sets.length;
    setSetIndex(Math.min(doneSets, exercises[i].sets - 1));
    setValue(exercises[i].reps);
    setUseWeight(false);
    setPhase('exercise');
    setShowSwitcher(false);
  };

  const finishNow = async () => {
    setPhase('complete');
    setAiLoading(true);
    const totalSets = logs.reduce((a,l)=>a+l.sets.length,0);
    const summary = `メニュー「${routineName(routine, level)}」(${levelById(level).label}レベル)を実施。種目数${logs.length}、合計セット数${totalSets}。`;
    const msg = await fetchEncouragement(summary);
    setAiMessage(msg || FALLBACK_MESSAGES[Math.floor(Math.random()*FALLBACK_MESSAGES.length)]);
    setAiLoading(false);
  };

  const save = () => {
    const durationMin = Math.max(1, Math.round((Date.now()-startTime.current)/60000));
    const totalCount = logs.reduce((a,l)=>a+l.sets.length,0);
    onSave({
      id:'w_'+Date.now(),
      date: toDateStr(new Date()),
      routineName: routineName(routine, level),
      level,
      durationMin,
      mood, note,
      exercises: logs,
      totalSets: totalCount,
    });
  };

  if (phase==='rest') {
    const pct = restTotal>0 ? (restLeft/restTotal)*100 : 0;
    return (
      <div className="min-h-[70vh] flex flex-col items-center justify-center text-center space-y-6 px-4">
        <p className="text-sm font-bold text-forest-600">ひとやすみ。深呼吸してみましょう</p>
        <div className="relative w-40 h-40 flex items-center justify-center">
          <svg className="w-40 h-40 -rotate-90">
            <circle cx="80" cy="80" r="70" stroke="#EAF3EF" strokeWidth="10" fill="none" />
            <circle cx="80" cy="80" r="70" stroke="#2F6F5E" strokeWidth="10" fill="none"
              strokeDasharray={2*Math.PI*70} strokeDashoffset={2*Math.PI*70*(1-pct/100)} className="transition-all duration-1000" strokeLinecap="round" />
          </svg>
          <span className="absolute text-3xl font-display font-black text-forest-700">{restLeft}</span>
        </div>
        <div className="flex items-center gap-3">
          <button onClick={()=>{ setRestLeft(l=>l+30); setRestTotal(t=>t+30); }}
            className="px-4 py-2 rounded-full bg-white border-2 border-forest-200 text-forest-600 text-xs font-bold">＋30秒</button>
          <button onClick={()=>{ setRestLeft(0); setPhase(afterRest); }} className="text-xs font-bold text-slate-400 underline">休憩をとばす</button>
        </div>
      </div>
    );
  }

  if (phase==='bonus') {
    return (
      <div className="min-h-[60vh] flex flex-col items-center justify-center text-center space-y-6 px-6">
        <div className="text-5xl">🌿</div>
        <h2 className="text-lg font-display font-black text-forest-700">ここまで、よく頑張りました！</h2>
        <p className="text-sm text-slate-500">もう少しだけ、続けてみますか？</p>
        <div className="w-full space-y-3">
          <button onClick={handleWantBonus} className="w-full py-3.5 bg-forest-600 hover:bg-forest-700 text-white font-black text-sm rounded-2xl soft-shadow">もう1種目やってみる</button>
          <button onClick={finishNow} className="w-full py-3.5 bg-white border border-slate-200 text-slate-600 font-bold text-sm rounded-2xl">ここまでにする</button>
        </div>
        {showBonusPicker && (
          <BonusPickerModal
            pool={availablePool.filter(e => !exercises.find(x=>x.id===e.id))}
            onClose={()=>setShowBonusPicker(false)}
            onSelect={addSelectedExercise}
          />
        )}
      </div>
    );
  }

  if (phase==='complete') {
    const totalCount = logs.reduce((a,l)=>a+l.sets.length,0);
    return (
      <div className="min-h-[70vh] relative space-y-5 px-1">
        <ConfettiBurst />
        <div className="text-center pt-4">
          <div className="text-5xl">🎉</div>
          <h2 className="text-xl font-display font-black text-forest-700 mt-2">おつかれさまでした！</h2>
          <p className="text-sm text-slate-500 mt-1">今日は{logs.length}種目・合計{totalCount}セット、がんばりました</p>
        </div>

        <div className="bg-white rounded-2xl p-4 soft-shadow min-h-[64px] flex items-center gap-3">
          {aiLoading ? (
            <p className="text-xs text-slate-400 font-bold">応援メッセージを準備中...</p>
          ) : (
            <p className="text-sm text-forest-700 font-bold leading-relaxed">{aiMessage}</p>
          )}
        </div>

        <div className="bg-white rounded-2xl p-4 soft-shadow space-y-3">
          <p className="text-xs font-bold text-slate-500">今日の気分は？(任意)</p>
          <div className="flex justify-center gap-4">
            {['😊','😐','😣'].map(e => (
              <button key={e} onClick={()=>setMood(e)}
                className={`w-14 h-14 rounded-2xl text-2xl flex items-center justify-center transition-all ${mood===e ? 'bg-coral-50 border-2 border-coral-500 scale-110' : 'bg-sand-50 border-2 border-transparent'}`}>{e}</button>
            ))}
          </div>
          <textarea value={note} onChange={(e)=>setNote(e.target.value)} rows="2" placeholder="ひとこと日記(任意)"
            className="w-full bg-sand-50 border border-sand-100 rounded-xl p-3 text-xs focus:outline-none focus:border-forest-300" />
        </div>

        <button onClick={save} className="w-full py-3.5 bg-forest-600 hover:bg-forest-700 text-white font-black text-sm rounded-2xl soft-shadow">きろくを保存する</button>
      </div>
    );
  }

  /* exercise phase */
  const bp = bodyPartOf(current.bodyPart);
  return (
    <div className="space-y-5 pb-4">
      <div className="flex items-center justify-between">
        <button onClick={onCancel} className="text-xs font-bold text-slate-400">やめる</button>
        <p className="text-xs font-bold text-slate-400">{exIndex+1} / {exercises.length} 種目め</p>
      </div>

      <div className="flex items-center justify-center gap-2">
        <div className="flex gap-1.5">
          {exercises.map((_,i)=>(
            <button key={i} onClick={()=>jumpToExercise(i)}
              className={`h-1.5 rounded-full transition-all ${i<exIndex ? 'w-6 bg-forest-500' : i===exIndex ? 'w-10 bg-coral-500' : 'w-6 bg-sand-100'}`}></button>
          ))}
        </div>
      </div>
      <button onClick={()=>setShowSwitcher(true)} className="block mx-auto text-[11px] font-bold text-forest-600 bg-forest-50 px-3 py-1.5 rounded-full">
        <i className="fas fa-shuffle mr-1"></i>種目を変更する
      </button>

      <div className="bg-white rounded-3xl p-6 soft-shadow text-center pop-in" key={current.id+exIndex}>
        <span className="text-[11px] font-bold px-2 py-0.5 rounded-full inline-block" style={{ backgroundColor:`${bp.color}1A`, color:bp.color }}>{bp.name}</span>
        <div className="w-16 h-16 mx-auto mt-3 rounded-2xl bg-forest-50 text-forest-600 flex items-center justify-center text-2xl">
          <i className={`fas ${current.icon}`}></i>
        </div>
        <h2 className="text-xl font-display font-black text-slate-800 mt-3">{current.name}</h2>
        <p className="text-xs text-slate-500 mt-2 leading-relaxed">{current.tip}</p>
        <p className="text-xs font-bold text-forest-500 mt-3">{setIndex+1} / {current.sets} セットめ</p>
        {previous ? (
          <div className="inline-flex items-center gap-1.5 bg-sand-50 rounded-full px-3 py-1.5 mt-3">
            <i className="fas fa-clock-rotate-left text-[10px] text-slate-400"></i>
            <span className="text-[11px] font-bold text-slate-500">前回({formatFriendly(previous.date)}): {formatSetsSummary(previous.sets, current.unit)}</span>
          </div>
        ) : (
          <div className="inline-flex items-center gap-1.5 bg-sand-50 rounded-full px-3 py-1.5 mt-3">
            <span className="text-[11px] font-bold text-slate-400">はじめての記録になります</span>
          </div>
        )}
      </div>

      <div className="bg-white rounded-3xl p-6 soft-shadow space-y-4">
        {isBeatingPrevious && (
          <p className="text-center text-xs font-bold text-forest-600"><i className="fas fa-arrow-trend-up mr-1"></i>前回を上回っています！</p>
        )}
        {current.unit === '秒' ? (
          <div className="text-center space-y-4">
            <div className="relative w-40 h-40 mx-auto flex items-center justify-center">
              <svg className="w-40 h-40 -rotate-90">
                <circle cx="80" cy="80" r="70" stroke="#EAF3EF" strokeWidth="10" fill="none" />
                <circle cx="80" cy="80" r="70" stroke="#FF8B6B" strokeWidth="10" fill="none"
                  strokeDasharray={2*Math.PI*70} strokeDashoffset={2*Math.PI*70*(1-Math.min(1,timerElapsed/value))} className="transition-all duration-1000" strokeLinecap="round" />
              </svg>
              <div className="absolute text-center">
                <span className="text-3xl font-display font-black text-forest-700">{timerElapsed}</span>
                <span className="text-xs font-bold text-forest-300 block">/ {value}秒</span>
              </div>
            </div>
            {!timerRunning && timerElapsed===0 && (
              <div className="flex items-center justify-center gap-3">
                <button onClick={()=>setValue(Math.max(5,value-5))} className="w-9 h-9 rounded-xl bg-white border-2 border-forest-100 text-forest-600 font-bold">−</button>
                <span className="text-xs font-bold text-slate-400">目標を調整</span>
                <button onClick={()=>setValue(value+5)} className="w-9 h-9 rounded-xl bg-coral-500 text-white font-bold">＋</button>
              </div>
            )}
            <div className="flex gap-2">
              {!timerRunning ? (
                <button onClick={()=>setTimerRunning(true)} className="flex-1 py-3.5 bg-coral-500 hover:bg-coral-600 text-white font-black text-sm rounded-2xl">
                  <i className="fas fa-play mr-1"></i>{timerElapsed===0 ? 'スタート' : '再開'}
                </button>
              ) : (
                <button onClick={()=>setTimerRunning(false)} className="flex-1 py-3.5 bg-white border-2 border-forest-200 text-forest-600 font-black text-sm rounded-2xl">
                  <i className="fas fa-pause mr-1"></i>一時停止
                </button>
              )}
              {timerElapsed>0 && (
                <button onClick={()=>{ setTimerRunning(false); logSet(); }} className="flex-1 py-3.5 bg-forest-600 hover:bg-forest-700 text-white font-black text-sm rounded-2xl">
                  ここで記録する
                </button>
              )}
            </div>
          </div>
        ) : (
          <Stepper value={value} onChange={setValue} step={1} min={1} unit={current.unit} />
        )}
        <div className="flex items-center justify-center gap-2">
          <button onClick={()=>setUseWeight(!useWeight)}
            className={`text-xs font-bold px-3 py-1.5 rounded-full border transition-colors ${useWeight ? 'bg-forest-50 border-forest-300 text-forest-700' : 'bg-white border-slate-200 text-slate-400'}`}>
            <i className="fas fa-dumbbell mr-1"></i>重りを使う
          </button>
        </div>
        {useWeight && (
          <div className="space-y-3">
            <Stepper value={weight} onChange={setWeight} step={0.5} min={0.5} unit="kg" />
            <div className="flex flex-wrap justify-center gap-1.5">
              {[1.25,2.5,5,10,20].map(p => (
                <button key={p} onClick={()=>setWeight(w=>Math.round((w+p)*100)/100)}
                  className="px-3 py-1.5 rounded-full bg-sand-50 border border-sand-100 text-xs font-bold text-forest-600">+{p}kg</button>
              ))}
              <button onClick={()=>setWeight(2)} className="px-3 py-1.5 rounded-full bg-white border border-slate-200 text-xs font-bold text-slate-400">リセット</button>
            </div>
          </div>
        )}
      </div>

      {current.unit !== '秒' && (
        <button onClick={logSet} className="w-full py-4 bg-coral-500 hover:bg-coral-600 text-white font-black text-base rounded-2xl soft-shadow active:scale-95 transition-transform">
          できた！
        </button>
      )}

      {showSwitcher && (
        <ExerciseSwitcherModal exercises={exercises} logs={logs} currentIndex={exIndex} onClose={()=>setShowSwitcher(false)} onSelect={jumpToExercise} />
      )}
    </div>
  );
}

/* ---------- custom exercises ---------- */

  const [name, setName] = useState('');
  const [bodyPart, setBodyPart] = useState('chest');
  const [unit, setUnit] = useState('回');
  const [sets, setSets] = useState(3);
  const [reps, setReps] = useState(10);
  const [difficulty, setDifficulty] = useState('ふつう');
  const [tip, setTip] = useState('');
  const [rest, setRest] = useState(30);

  const submit = () => {
    if (!name.trim()) return;
    onSave({
      id:'custom_'+Date.now(), custom:true, name:name.trim(), bodyPart, icon:'fa-star',
      tip: tip.trim() || '自分で追加した種目です。', sets, reps, unit, difficulty,
      restSet:rest, restExercise:rest,
    });
  };

  return (
    <div className="fixed inset-0 z-50 bg-slate-800/40 backdrop-blur-sm flex items-center justify-center p-6">
      <div className="bg-white rounded-2xl max-w-sm w-full p-5 space-y-4 soft-shadow max-h-[85vh] overflow-y-auto">
        <div className="flex justify-between items-center">
          <h4 className="text-sm font-black text-slate-800">自分の種目を追加</h4>
          <button onClick={onClose} className="text-slate-400"><i className="fas fa-times"></i></button>
        </div>
        <div>
          <p className="text-xs font-bold text-slate-500 mb-1">種目名</p>
          <input value={name} onChange={e=>setName(e.target.value)} placeholder="例: ケーブルクロスオーバー"
            className="w-full bg-sand-50 border border-sand-100 rounded-xl p-2.5 text-sm focus:outline-none focus:border-forest-300" />
        </div>
        <div>
          <p className="text-xs font-bold text-slate-500 mb-1">部位</p>
          <div className="flex flex-wrap gap-1.5">
            {BODY_PARTS.map(bp => (
              <button key={bp.id} onClick={()=>setBodyPart(bp.id)}
                className={`px-3 py-1.5 rounded-full text-xs font-bold border ${bodyPart===bp.id ? 'text-white border-transparent' : 'bg-white text-slate-500 border-slate-200'}`}
                style={bodyPart===bp.id ? { backgroundColor:bp.color } : {}}>{bp.name}</button>
            ))}
          </div>
        </div>
        <div>
          <p className="text-xs font-bold text-slate-500 mb-1">目標セット数</p>
          <Stepper value={sets} onChange={setSets} min={1} unit="セット" />
        </div>
        <div>
          <p className="text-xs font-bold text-slate-500 mb-1">単位</p>
          <div className="flex gap-1.5">
            {['回','秒'].map(u => (
              <button key={u} onClick={()=>setUnit(u)} className={`px-3 py-1.5 rounded-full text-xs font-bold border ${unit===u ? 'bg-forest-600 text-white border-forest-600' : 'bg-white text-slate-500 border-slate-200'}`}>{u}</button>
            ))}
          </div>
        </div>
        <div>
          <p className="text-xs font-bold text-slate-500 mb-1">目標{unit}数</p>
          <Stepper value={reps} onChange={setReps} step={unit==='秒'?5:1} min={1} unit={unit} />
        </div>
        <div>
          <p className="text-xs font-bold text-slate-500 mb-1">難易度</p>
          <div className="flex gap-1.5">
            {['かんたん','ふつう','しっかり'].map(d => (
              <button key={d} onClick={()=>setDifficulty(d)} className={`px-3 py-1.5 rounded-full text-xs font-bold border ${difficulty===d ? 'bg-forest-600 text-white border-forest-600' : 'bg-white text-slate-500 border-slate-200'}`}>{d}</button>
            ))}
          </div>
        </div>
        <div>
          <p className="text-xs font-bold text-slate-500 mb-1">セット間の休憩時間</p>
          <Stepper value={rest} onChange={setRest} step={15} min={15} unit="秒" />
        </div>
        <div>
          <p className="text-xs font-bold text-slate-500 mb-1">やり方メモ(任意)</p>
          <textarea value={tip} onChange={e=>setTip(e.target.value)} rows="2" className="w-full bg-sand-50 border border-sand-100 rounded-xl p-2.5 text-xs focus:outline-none focus:border-forest-300" />
        </div>
        <button onClick={submit} className="w-full py-3 bg-coral-500 hover:bg-coral-600 text-white font-black text-sm rounded-2xl">追加する</button>
      </div>
    </div>
  );
}

/* ---------- free exercise builder (中級者・上級者むけ) ---------- */
function ExerciseSwitcherModal({ exercises, logs, currentIndex, onClose, onSelect }) {
  return (
    <div className="fixed inset-0 z-50 bg-slate-800/40 backdrop-blur-sm flex items-center justify-center p-6">
      <div className="bg-white rounded-2xl max-w-sm w-full p-5 space-y-3 soft-shadow max-h-[80vh] overflow-y-auto">
        <div className="flex justify-between items-center">
          <h4 className="text-sm font-black text-slate-800">種目を変更する</h4>
          <button onClick={onClose} className="text-slate-400"><i className="fas fa-times"></i></button>
        </div>
        {exercises.map((ex, i) => {
          const doneSets = logs[i] ? logs[i].sets.length : 0;
          const isCurrent = i===currentIndex;
          const isDone = doneSets >= ex.sets;
          const bp = bodyPartOf(ex.bodyPart);
          return (
            <button key={i} onClick={()=>onSelect(i)}
              className={`w-full text-left rounded-xl p-3 flex items-center gap-3 border-2 transition-colors ${isCurrent ? 'bg-forest-50 border-forest-400' : 'bg-white border-slate-100'}`}>
              <div className="w-9 h-9 rounded-lg flex items-center justify-center text-sm flex-shrink-0" style={{ backgroundColor:`${bp.color}1A`, color:bp.color }}>
                <i className={`fas ${ex.icon}`}></i>
              </div>
              <div className="flex-1">
                <p className="text-xs font-black text-slate-800">{ex.name}</p>
                <p className="text-[10px] text-slate-400 font-bold">{doneSets} / {ex.sets} セット{isDone ? '・完了' : ''}</p>
              </div>
              {isCurrent && <i className="fas fa-arrow-right text-forest-600 text-xs"></i>}
            </button>
          );
        })}
      </div>
    </div>
  );
}

function BonusPickerModal({ pool, onClose, onSelect }) {
  return (
    <div className="fixed inset-0 z-50 bg-slate-800/40 backdrop-blur-sm flex items-center justify-center p-6">
      <div className="bg-white rounded-2xl max-w-sm w-full p-5 space-y-3 soft-shadow max-h-[80vh] overflow-y-auto">
        <div className="flex justify-between items-center">
          <h4 className="text-sm font-black text-slate-800">追加する種目を選ぶ</h4>
          <button onClick={onClose} className="text-slate-400"><i className="fas fa-times"></i></button>
        </div>
        {pool.length===0 && <p className="text-xs text-slate-400 font-bold text-center py-4">選べる種目がありません</p>}
        {pool.map(ex => {
          const bp = bodyPartOf(ex.bodyPart);
          return (
            <button key={ex.id} onClick={()=>onSelect(ex)}
              className="w-full text-left rounded-xl p-3 flex items-center gap-3 border-2 border-slate-100 bg-white hover:border-forest-300 transition-colors">
              <div className="w-9 h-9 rounded-lg flex items-center justify-center text-sm flex-shrink-0" style={{ backgroundColor:`${bp.color}1A`, color:bp.color }}>
                <i className={`fas ${ex.icon}`}></i>
              </div>
              <div className="flex-1">
                <p className="text-xs font-black text-slate-800">{ex.name}{ex.custom && <span className="ml-1 text-[9px] font-bold text-coral-500">カスタム</span>}</p>
                <p className="text-[10px] text-slate-400 font-bold">{bp.name} ・ {ex.sets}セット × {ex.reps}{ex.unit}</p>
              </div>
            </button>
          );
        })}
      </div>
    </div>
  );
}

function SaveRoutineModal({ onClose, onSave }) {
  const [name, setName] = useState('');
  return (
    <div className="fixed inset-0 z-50 bg-slate-800/40 backdrop-blur-sm flex items-center justify-center p-6">
      <div className="bg-white rounded-2xl max-w-sm w-full p-5 space-y-4 soft-shadow">
        <div className="flex justify-between items-center">
          <h4 className="text-sm font-black text-slate-800">マイメニューとして保存</h4>
          <button onClick={onClose} className="text-slate-400"><i className="fas fa-times"></i></button>
        </div>
        <div>
          <p className="text-xs font-bold text-slate-500 mb-1">メニュー名</p>
          <input value={name} onChange={e=>setName(e.target.value)} placeholder="例: 週末しっかりメニュー"
            className="w-full bg-sand-50 border border-sand-100 rounded-xl p-2.5 text-sm focus:outline-none focus:border-forest-300" />
        </div>
        <button onClick={()=>{ if(name.trim()) onSave(name.trim()); }} disabled={!name.trim()}
          className="w-full py-3 bg-coral-500 hover:bg-coral-600 disabled:opacity-40 text-white font-black text-sm rounded-2xl">保存する</button>
      </div>
    </div>
  );
}

function BuilderView({ level, customExercises, myRoutines, onSaveMyRoutine, onBack, onStart }) {
  const [selected, setSelected] = useState([]);
  const [showSaveModal, setShowSaveModal] = useState(false);
  const pool = useMemo(() => {
    const built = EXERCISES.filter(e=>isUnlockedForLevel(e, level)).map(e=>({ ...resolveExercise(e.id, level), custom:false }));
    const custom = customExercises.map(e=>({ ...e, custom:true }));
    return [...built, ...custom];
  }, [level, customExercises]);

  const toggle = (id) => setSelected(prev => prev.includes(id) ? prev.filter(x=>x!==id) : [...prev, id]);

  const buildRoutine = (name) => ({ id:'custom_routine', name: name || 'カスタムメニュー', desc:'自分で選んだ種目のメニュー', time:`約${selected.length*3}分`, icon:'fa-star', exerciseIds:selected });

  const start = () => {
    if (selected.length===0) return;
    onStart(buildRoutine());
  };

  const atLimit = myRoutines.length >= 3;

  return (
    <div className="space-y-4 pb-32">
      <button onClick={onBack} className="text-xs font-bold text-slate-400"><i className="fas fa-arrow-left mr-1"></i>もどる</button>
      <h2 className="text-lg font-display font-black text-forest-700">じぶんで種目を選ぶ</h2>
      <p className="text-xs text-slate-400 font-bold -mt-2">やりたい種目をタップしてください({selected.length}種目選択中)</p>
      <div className="space-y-2">
        {pool.map(v => {
          const bp = bodyPartOf(v.bodyPart);
          const isSel = selected.includes(v.id);
          return (
            <button key={v.id} onClick={()=>toggle(v.id)}
              className={`w-full text-left rounded-2xl p-3 flex items-center gap-3 border-2 transition-colors ${isSel ? 'bg-forest-50 border-forest-400' : 'bg-white border-transparent soft-shadow'}`}>
              <div className="w-9 h-9 rounded-lg flex items-center justify-center text-sm flex-shrink-0" style={{ backgroundColor:`${bp.color}1A`, color:bp.color }}>
                <i className={`fas ${v.icon}`}></i>
              </div>
              <div className="flex-1">
                <p className="text-xs font-black text-slate-800">{v.name}{v.custom && <span className="ml-1 text-[9px] font-bold text-coral-500">カスタム</span>}</p>
                <p className="text-[10px] text-slate-400 font-bold">{bp.name} ・ {v.sets}セット × {v.reps}{v.unit}</p>
              </div>
              {isSel && <i className="fas fa-check-circle text-forest-600"></i>}
            </button>
          );
        })}
      </div>
      <div className="fixed bottom-0 left-0 right-0 bg-white/95 backdrop-blur-sm border-t border-sand-100 p-3 z-30 space-y-2">
        <button onClick={start} disabled={selected.length===0}
          className="max-w-md mx-auto w-full block py-3.5 bg-coral-500 disabled:opacity-40 text-white font-black text-sm rounded-2xl soft-shadow">
          この内容ではじめる({selected.length}種目)
        </button>
        <button onClick={()=>setShowSaveModal(true)} disabled={selected.length===0 || atLimit}
          className="max-w-md mx-auto w-full block py-2 text-center text-xs font-bold text-forest-600 disabled:text-slate-300">
          <i className="fas fa-bookmark mr-1"></i>
          {atLimit ? 'マイメニューは3つまで保存できます' : `マイメニューとして保存する(${myRoutines.length}/3)`}
        </button>
      </div>
      {showSaveModal && (
        <SaveRoutineModal onClose={()=>setShowSaveModal(false)} onSave={(name)=>{ onSaveMyRoutine(buildRoutine(name)); setShowSaveModal(false); }} />
      )}
    </div>
  );
}

/* ---------- app ---------- */
function App() {
  const [loaded, setLoaded] = useState(false);
  const [workouts, setWorkouts] = useState([]);
  const [level, setLevel] = useState('beginner');
  const [focusMode, setFocusMode] = useState(false);
  const [customExercises, setCustomExercises] = useState([]);
  const [myRoutines, setMyRoutines] = useState([]);
  const [tab, setTab] = useState('home');
  const [view, setView] = useState('home'); // home | picker | session | collection | builder
  const [activeRoutine, setActiveRoutine] = useState(null);
  const [confirm, setConfirm] = useState(null);
  const [milestoneReveal, setMilestoneReveal] = useState(null);

  useEffect(() => { (async () => {
    const [w, lvl, focus, custom, myR] = await Promise.all([loadWorkouts(), loadLevel(), loadFocusMode(), loadCustomExercises(), loadMyRoutines()]);
    setWorkouts(w);
    if (lvl) setLevel(lvl);
    setFocusMode(focus);
    setCustomExercises(custom);
    setMyRoutines(myR);
    setLoaded(true);
  })(); }, []);

  useEffect(() => { if (loaded) persistWorkouts(workouts); }, [workouts, loaded]);
  useEffect(() => { if (loaded) persistLevel(level); }, [level, loaded]);
  useEffect(() => { if (loaded) persistFocusMode(focusMode); }, [focusMode, loaded]);
  useEffect(() => { if (loaded) persistCustomExercises(customExercises); }, [customExercises, loaded]);
  useEffect(() => { if (loaded) persistMyRoutines(myRoutines); }, [myRoutines, loaded]);

  const startRoutine = (routine) => { setActiveRoutine(routine); setView('session'); };
  const cancelSession = () => {
    setConfirm({
      title:'トレーニングをやめますか？',
      message:'ここまでのきろくは保存されません。',
      onConfirm: () => { setView('home'); setActiveRoutine(null); setConfirm(null); },
      onCancel: () => setConfirm(null),
    });
  };
  const saveSession = (record) => {
    const beforeDays = totalTrainedDays(workouts);
    const afterWorkouts = [record, ...workouts];
    const afterDays = totalTrainedDays(afterWorkouts);
    const crossed = crossedMilestones(beforeDays, afterDays);
    setWorkouts(afterWorkouts);
    setView('home'); setActiveRoutine(null); setTab('home');
    if (crossed.length>0) setMilestoneReveal(crossed[crossed.length-1]);
  };
  const deleteWorkout = (id) => {
    setConfirm({
      title:'このきろくを削除しますか？',
      message:'この操作はもとに戻せません。',
      onConfirm: () => { setWorkouts(prev => prev.filter(w=>w.id!==id)); setConfirm(null); },
      onCancel: () => setConfirm(null),
    });
  };
  const addCustomExercise = (ex) => setCustomExercises(prev => [...prev, ex]);
  const deleteCustomExercise = (id) => setCustomExercises(prev => prev.filter(e=>e.id!==id));
  const addMyRoutine = (routine) => setMyRoutines(prev => prev.length>=3 ? prev : [...prev, { ...routine, id:'my_'+Date.now() }]);
  const deleteMyRoutine = (id) => setMyRoutines(prev => prev.filter(r=>r.id!==id));

  if (!loaded) {
    return (
      <div className="min-h-screen flex items-center justify-center">
        <div className="text-forest-500 text-sm font-bold"><i className="fas fa-seedling mr-2"></i>よみこみ中...</div>
      </div>
    );
  }

  return (
    <div className={`max-w-md mx-auto min-h-screen px-4 pt-6 pb-28 transition-all ${focusMode ? 'grayscale contrast-125' : ''}`}>
      {view==='session' && activeRoutine ? (
        <SessionView routine={activeRoutine} level={level} customExercises={customExercises} workouts={workouts} onCancel={cancelSession} onSave={saveSession} />
      ) : view==='picker' ? (
        <PickerView level={level} onLevelChange={setLevel} customExercises={customExercises} myRoutines={myRoutines} onDeleteMyRoutine={deleteMyRoutine} onStart={startRoutine} onBack={()=>setView('home')} onBuildCustom={()=>setView('builder')} />
      ) : view==='builder' ? (
        <BuilderView level={level} customExercises={customExercises} myRoutines={myRoutines} onSaveMyRoutine={addMyRoutine} onBack={()=>setView('picker')} onStart={startRoutine} />
      ) : view==='collection' ? (
        <CollectionView workouts={workouts} onBack={()=>setView('home')} />
      ) : (
        <React.Fragment>
          {tab==='home' && <HomeView workouts={workouts} level={level} onLevelChange={setLevel} focusMode={focusMode} onToggleFocus={()=>setFocusMode(f=>!f)} onOpenCollection={()=>setView('collection')} onStart={startRoutine} onPickRoutine={()=>setView('picker')} />}
          {tab==='history' && <HistoryView workouts={workouts} onDelete={deleteWorkout} />}
          {tab==='library' && <LibraryView level={level} onLevelChange={setLevel} customExercises={customExercises} onAddCustom={addCustomExercise} onDeleteCustom={deleteCustomExercise} />}
          <BottomNav tab={tab} setTab={setTab} />
        </React.Fragment>
      )}

      {confirm && (
        <div className="fixed inset-0 z-50 bg-slate-800/40 backdrop-blur-sm flex items-center justify-center p-6">
          <div className="bg-white rounded-2xl max-w-xs w-full p-5 space-y-3 text-center soft-shadow">
            <h4 className="text-sm font-black text-slate-800">{confirm.title}</h4>
            <p className="text-xs text-slate-500">{confirm.message}</p>
            <div className="flex justify-center gap-2 pt-2">
              <button onClick={confirm.onCancel} className="px-4 py-2 bg-white border border-slate-200 text-slate-600 font-bold text-xs rounded-xl">キャンセル</button>
              <button onClick={confirm.onConfirm} className="px-4 py-2 bg-coral-500 text-white font-bold text-xs rounded-xl">はい</button>
            </div>
          </div>
        </div>
      )}

      {milestoneReveal && (
        <MilestoneRevealOverlay milestone={milestoneReveal} onClose={()=>setMilestoneReveal(null)} />
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
