const WEEKDAY = ['日','月','火','水','木','金','土'];
const toDateStr = (d) => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const formatFriendly = (dateStr) => {
  const [y,m,d] = dateStr.split('-').map(Number);
  const dt = new Date(y, m-1, d);
  return `${m}/${d}(${WEEKDAY[dt.getDay()]})`;
};
const findPreviousLog = (workouts, exerciseId) => {
  for (const w of workouts) {
    const log = w.exercises.find(e => e.exerciseId === exerciseId);
    if (log && log.sets && log.sets.length > 0) return { date: w.date, sets: log.sets };
  }
  return null;
};
const formatSetsSummary = (sets, unit) => sets.map(s => s.weight > 0 ? `${s.weight}kg×${s.value}${unit}` : `${s.value}${unit}`).join('・');
const calcStreak = (workouts) => {
  const dateSet = new Set(workouts.map(w=>w.date));
  let streak = 0;
  let cursor = new Date();
  if (!dateSet.has(toDateStr(cursor))) cursor.setDate(cursor.getDate()-1);
  while (dateSet.has(toDateStr(cursor))) { streak++; cursor.setDate(cursor.getDate()-1); }
  return streak;
};
const last7Days = (workouts) => {
  const dateSet = new Set(workouts.map(w=>w.date));
  const days = [];
  for (let i=6;i>=0;i--){
    const d = new Date(); d.setDate(d.getDate()-i);
    const ds = toDateStr(d);
    days.push({ date:ds, done:dateSet.has(ds), label:WEEKDAY[d.getDay()] });
  }
  return days;
};
const groupWorkoutsByDate = (workouts) => {
  const map = new Map();
  workouts.forEach(w => {
    if (!map.has(w.date)) map.set(w.date, []);
    map.get(w.date).push(w);
  });
  return Array.from(map.entries()).map(([date, items]) => ({ date, items }));
};

/* ---------- MET method ---------- */
const MET_OVERRIDES = {
  plank: { 'かんたん':2.5, 'ふつう':2.8, 'しっかり':3.5 },
  crunch: { 'かんたん':3.0, 'ふつう':3.8, 'しっかり':4.5 },
  march: { 'かんたん':2.5, 'ふつう':3.5, 'しっかり':4.5 },
  knee_burpee: { 'かんたん':5.0, 'ふつう':6.0, 'しっかり':8.0 },
};
const GYM_MACHINE_IDS = ['bb_bench','bb_squat','bb_deadlift','chest_press_machine','cable_crossover','lat_pulldown','seated_row','leg_press','leg_extension','leg_curl','shoulder_press_machine','ab_machine'];
const metForLog = (log) => {
  if (MET_OVERRIDES[log.exerciseId]) return MET_OVERRIDES[log.exerciseId][log.difficulty] || 4.0;
  if (GYM_MACHINE_IDS.includes(log.exerciseId)) return log.difficulty==='しっかり' ? 6.0 : 5.0;
  const map = { 'かんたん':3.0, 'ふつう':4.0, 'しっかり':6.0 };
  return map[log.difficulty] || 4.0;
};
const caloriesForLog = (log, weightKg) => {
  if (!weightKg) return 0;
  const met = metForLog(log);
  return log.sets.reduce((total, s) => {
    const seconds = log.unit==='秒' ? s.value : s.value * 3;
    return total + met * weightKg * (seconds / 3600);
  }, 0);
};
const caloriesForWorkout = (workout, weightKg) => {
  if (!weightKg || !workout.exercises) return 0;
  return workout.exercises.reduce((total, log) => total + caloriesForLog(log, weightKg), 0);
};

/* ---------- share image ---------- */
const drawRoundedRect = (ctx, x, y, w, h, r) => {
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.arcTo(x+w, y, x+w, y+h, r);
  ctx.arcTo(x+w, y+h, x, y+h, r);
  ctx.arcTo(x, y+h, x, y, r);
  ctx.arcTo(x, y, x+w, y, r);
  ctx.closePath();
};
const wrapCanvasText = (ctx, text, x, y, maxWidth, lineHeight) => {
  let line = '';
  for (const ch of text) {
    const testLine = line + ch;
    if (ctx.measureText(testLine).width > maxWidth && line.length>0) {
      ctx.fillText(line, x, y);
      line = ch;
      y += lineHeight;
    } else {
      line = testLine;
    }
  }
  ctx.fillText(line, x, y);
  return y + lineHeight;
};
const generateShareImage = (workout) => {
  const FONT = '"Hiragino Sans","Yu Gothic","Noto Sans JP",sans-serif';
  const W = 900, pad = 50;
  const HEADER_H = 620;
  const PER_EXERCISE_H = 130;
  const NOTE_H = workout.note ? 130 : 0;
  const H = Math.max(1000, HEADER_H + workout.exercises.length*PER_EXERCISE_H + NOTE_H + pad*2);

  const canvas = document.createElement('canvas');
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');

  const bgGrad = ctx.createLinearGradient(0,0,0,H);
  bgGrad.addColorStop(0, '#2F6F5E');
  bgGrad.addColorStop(1, '#1C4438');
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0,0,W,H);

  drawRoundedRect(ctx, pad, pad, W-pad*2, H-pad*2, 40);
  ctx.fillStyle = '#FFFFFF';
  ctx.fill();

  ctx.textAlign = 'center';
  let y = pad + 80;

  ctx.fillStyle = '#8FBBA9';
  ctx.font = `bold 28px ${FONT}`;
  ctx.fillText('🌱 ゆるトレ日記', W/2, y);
  y += 55;

  ctx.fillStyle = '#94a3b8';
  ctx.font = `bold 26px ${FONT}`;
  ctx.fillText(formatFriendly(workout.date) + (workout.level ? ` ・ ${levelById(workout.level).label}` : ''), W/2, y);
  y += 75;

  ctx.fillStyle = '#263238';
  ctx.font = `bold 50px ${FONT}`;
  ctx.fillText(workout.routineName, W/2, y);
  y += 40;

  if (workout.mood) {
    y += 70;
    ctx.font = `64px ${FONT}`;
    ctx.fillText(workout.mood, W/2, y);
    y += 30;
  } else {
    y += 40;
  }

  const kcal = workout.bodyWeightKg ? Math.round(caloriesForWorkout(workout, workout.bodyWeightKg)) : null;
  const stats = [
    { label:'種目', value:`${workout.exercises.length}` },
    { label:'セット', value:`${workout.totalSets}` },
    { label:'時間', value:`${workout.durationMin}分` },
  ];
  if (kcal!==null) stats.push({ label:'kcal', value:`${kcal}` });

  y += 40;
  const statW = (W - pad*2 - 60) / stats.length;
  stats.forEach((s,i) => {
    const cx = pad + 30 + statW*i + statW/2;
    ctx.fillStyle = '#FF8B6B';
    ctx.font = `bold 46px ${FONT}`;
    ctx.fillText(s.value, cx, y);
    ctx.fillStyle = '#94a3b8';
    ctx.font = `bold 22px ${FONT}`;
    ctx.fillText(s.label, cx, y+38);
  });
  y += 110;

  ctx.strokeStyle = '#EAF3EF';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(pad+40, y);
  ctx.lineTo(W-pad-40, y);
  ctx.stroke();
  y += 55;

  ctx.textAlign = 'left';
  workout.exercises.forEach(ex => {
    ctx.font = `bold 30px ${FONT}`;
    ctx.fillStyle = '#2F6F5E';
    ctx.fillText('・ ' + ex.name, pad+50, y);
    y += 38;
    const summary = ex.sets && ex.sets.length ? formatSetsSummary(ex.sets, ex.unit) : '記録なし';
    ctx.font = `22px ${FONT}`;
    ctx.fillStyle = '#94a3b8';
    y = wrapCanvasText(ctx, summary, pad+68, y, W-pad*2-118, 30);
    y += 14;
  });

  if (workout.note) {
    y += 15;
    ctx.fillStyle = '#64748b';
    ctx.font = `24px ${FONT}`;
    wrapCanvasText(ctx, `💬 ${workout.note}`, pad+50, y, W-pad*2-100, 34);
  }

  return canvas;
};
const shareOrDownloadImage = (workout) => {
  const canvas = generateShareImage(workout);
  canvas.toBlob(async (blob) => {
    if (!blob) return;
    const filename = `yurutore-${workout.date}.png`;
    try {
      const file = new File([blob], filename, { type:'image/png' });
      if (navigator.share && navigator.canShare && navigator.canShare({ files:[file] })) {
        await navigator.share({ files:[file], title:'ゆるトレ日記', text:`${workout.routineName}を記録しました！` });
        return;
      }
    } catch (e) { }
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }, 'image/png');
};

let sharedAudioCtx = null;
const getAudioContext = () => {
  if (!sharedAudioCtx) {
    try { sharedAudioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    catch (e) { return null; }
  }
  return sharedAudioCtx;
};
const unlockAudio = () => {
  const ctx = getAudioContext();
  if (ctx && ctx.state === 'suspended') { ctx.resume().catch(()=>{}); }
};
const playTone = (freq=880, duration=0.15, volume=0.15) => {
  const ctx = getAudioContext();
  if (!ctx) return;
  try {
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(volume, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + duration);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + duration);
  } catch (e) {}
};
const playCompleteChime = () => {
  playTone(660, 0.12, 0.15);
  setTimeout(()=>playTone(880, 0.18, 0.15), 130);
};

function Stepper({ value, onChange, step=1, min=0, unit }) {
  const [text, setText] = useState(String(value));
  useEffect(() => { setText(String(value)); }, [value]);

  const handleType = (e) => {
    const raw = e.target.value;
    setText(raw);
    if (raw === '') return;
    const v = parseFloat(raw);
    if (!isNaN(v)) onChange(v);
  };
  const handleBlur = () => {
    if (text === '' || isNaN(parseFloat(text))) {
      setText(String(min));
      onChange(min);
    }
  };
  return (
    <div className="flex items-center justify-center gap-4">
      <button onClick={()=>onChange(Math.max(min, value-step))}
        className="w-12 h-12 rounded-2xl bg-white border-2 border-forest-100 text-forest-600 text-xl font-bold soft-shadow active:scale-95 transition-transform">−</button>
      <div className="w-24 text-center flex items-center justify-center gap-1">
        <input type="number" inputMode="decimal" value={text} onChange={handleType} onBlur={handleBlur}
          className="w-16 text-center text-4xl font-display font-black text-forest-700 bg-transparent focus:outline-none focus:bg-sand-50 rounded-lg" />
        <span className="text-sm font-bold text-forest-300">{unit}</span>
      </div>
      <button onClick={()=>onChange(value+step)}
        className="w-12 h-12 rounded-2xl bg-coral-500 text-white text-xl font-bold soft-shadow active:scale-95 transition-transform">＋</button>
    </div>
  );
}

/* ---------- guided session ---------- */
const REST_SET = 60, REST_EXERCISE = 60;

function SessionView({ routine, level, customExercises, favorites, workouts, profile, onCancel, onSave }) {
  const [exercises, setExercises] = useState(routine.exerciseIds.map(id=>resolveExercise(id, level, customExercises)));
  const [logs, setLogs] = useState(exercises.map(e => ({ exerciseId:e.id, name:e.name, bodyPart:e.bodyPart, icon:e.icon, unit:e.unit, difficulty:e.difficulty, sets:[] })));
  const [exIndex, setExIndex] = useState(0);
  const [setIndex, setSetIndex] = useState(0);
  const [value, setValue] = useState(exercises[0].reps);
  const [useWeight, setUseWeight] = useState(false);
  const [weight, setWeight] = useState(2);
  const [phase, setPhase] = useState('exercise');
  const [showSwitcher, setShowSwitcher] = useState(false);
  const [showBonusPicker, setShowBonusPicker] = useState(false);
  const [pendingNextIndex, setPendingNextIndex] = useState(null);
  const [restLeft, setRestLeft] = useState(0);
  const [restTotal, setRestTotal] = useState(REST_SET);
  const [afterRest, setAfterRest] = useState('exercise');
  const [mood, setMood] = useState(null);
  const [note, setNote] = useState('');
  const [aiMessage, setAiMessage] = useState(null);
  const [aiLoading, setAiLoading] = useState(false);
  const [timerRunning, setTimerRunning] = useState(false);
  const [timerElapsed, setTimerElapsed] = useState(0);
  const startTime = useRef(Date.now());

  const current = exercises[exIndex];
  const previous = useMemo(() => findPreviousLog(workouts, current.id), [current.id, workouts]);
  const previousBest = useMemo(() => {
    if (!previous) return null;
    return previous.sets.reduce((best, s) => {
      const effort = s.weight>0 ? s.weight*s.value : s.value;
      const bestEffort = best ? (best.weight>0 ? best.weight*best.value : best.value) : -1;
      return effort > bestEffort ? s : best;
    }, null);
  }, [previous]);
  const achievedValue = current.unit === '秒' ? timerElapsed : value;
  const currentEffort = useWeight ? weight*achievedValue : achievedValue;
  const previousEffort = previousBest ? (previousBest.weight>0 ? previousBest.weight*previousBest.value : previousBest.value) : null;
  const isBeatingPrevious = previousEffort!=null && achievedValue>0 && currentEffort > previousEffort;

  const availablePool = useMemo(() => {
    const built = EXERCISES.filter(e=>isUnlockedForLevel(e, level)).map(e=>resolveExercise(e.id, level, customExercises));
    return [...built, ...customExercises.map(e=>({ ...e }))];
  }, [level, customExercises]);

  useEffect(()=>{
    let iv;
    if (phase==='rest' && restLeft>0) {
      iv = setInterval(()=>setRestLeft(s=>{
        if (s<=1) {
          if (navigator.vibrate) navigator.vibrate([200,80,200]);
          playCompleteChime();
          setPhase(afterRest);
          return 0;
        }
        const next = s-1;
        if (next<=3) playTone(440, 0.07, 0.08);
        return next;
      }), 1000);
    }
    return ()=>clearInterval(iv);
  }, [phase, restLeft, afterRest]);

  const startRest = (seconds, next) => { setRestTotal(seconds); setRestLeft(seconds); setAfterRest(next); setPhase('rest'); };

  useEffect(() => { setTimerElapsed(0); setTimerRunning(false); }, [exIndex, setIndex]);

  useEffect(() => {
    let iv;
    if (timerRunning) {
      iv = setInterval(() => setTimerElapsed(t=>{
        const next = t+1;
        const remaining = value-next;
        if (remaining>0 && remaining<=3) playTone(440, 0.07, 0.08);
        return next;
      }), 1000);
    }
    return () => clearInterval(iv);
  }, [timerRunning, value]);

  useEffect(() => {
    if (timerRunning && current && current.unit==='秒' && timerElapsed >= value) {
      setTimerRunning(false);
      if (navigator.vibrate) navigator.vibrate([120,60,120]);
      playCompleteChime();
      logSet();
    }
  }, [timerElapsed]);

  const findNextIncompleteIndex = () => {
    const n = exercises.length;
    for (let step=1; step<=n; step++){
      const idx = (exIndex+step) % n;
      if (idx === exIndex) continue;
      if (logs[idx].sets.length < exercises[idx].sets) return idx;
    }
    return -1;
  };

  const logSet = () => {
    unlockAudio();
    if (navigator.vibrate) navigator.vibrate(30);
    setLogs(prev => {
      const copy = [...prev];
      copy[exIndex] = { ...copy[exIndex], sets:[...copy[exIndex].sets, { value, weight: useWeight ? weight : 0 }] };
      return copy;
    });
    const isLastSet = setIndex+1 >= current.sets;
    if (!isLastSet) {
      setSetIndex(setIndex+1);
      if (current.unit !== '秒') setValue(current.reps);
      startRest(current.restSet || REST_SET, 'exercise');
    } else {
      const nextIdx = findNextIncompleteIndex();
      if (nextIdx === -1) {
        setPhase('bonus');
      } else {
        setPendingNextIndex(nextIdx);
        startRest(current.restExercise || REST_EXERCISE, 'nextExercise');
      }
    }
  };

  useEffect(()=>{
    if (phase==='nextExercise' && pendingNextIndex!=null) {
      const idx = pendingNextIndex;
      setExIndex(idx);
      const doneSets = logs[idx] ? logs[idx].sets.length : 0;
      setSetIndex(Math.min(doneSets, exercises[idx].sets - 1));
      setValue(exercises[idx].reps);
      setUseWeight(false);
      setPhase('exercise');
      setPendingNextIndex(null);
    }
  }, [phase]);

  const addSelectedExercise = (pick) => {
    setExercises(prev => [...prev, pick]);
    setLogs(prev => [...prev, { exerciseId:pick.id, name:pick.name, bodyPart:pick.bodyPart, icon:pick.icon, unit:pick.unit, difficulty:pick.difficulty, sets:[] }]);
    setExIndex(exercises.length);
    setSetIndex(0);
    setValue(pick.reps);
    setUseWeight(false);
    setPhase('exercise');
    setShowBonusPicker(false);
  };

  const handleWantBonus = () => {
    const pool = availablePool.filter(e => !exercises.find(x=>x.id===e.id));
    if (pool.length===0) { finishNow(); return; }
    setShowBonusPicker(true);
  };

  const jumpToExercise = (i) => {
    setExIndex(i);
    const doneSets = logs[i].sets.length;
    setSetIndex(Math.min(doneSets, exercises[i].sets - 1));
    setValue(exercises[i].reps);
    setUseWeight(false);
    setPhase('exercise');
    setShowSwitcher(false);
  };

  const adjustTargetSets = (delta) => {
    setExercises(prev => {
      const copy = [...prev];
      copy[exIndex] = { ...copy[exIndex], sets: Math.max(1, copy[exIndex].sets + delta) };
      return copy;
    });
  };

  const removeExerciseAt = (i) => {
    if (exercises.length <= 1) return;
    const newList = exercises.filter((_, idx) => idx !== i);
    const newLogs = logs.filter((_, idx) => idx !== i);
    let newIndex = exIndex;
    if (i < exIndex) newIndex = exIndex - 1;
    else if (i === exIndex) newIndex = Math.min(exIndex, newList.length - 1);
    setExercises(newList);
    setLogs(newLogs);
    setExIndex(newIndex);
    const newCurrent = newList[newIndex];
    setSetIndex(Math.min(newLogs[newIndex].sets.length, newCurrent.sets - 1));
    setValue(newCurrent.reps);
    setUseWeight(false);
    setPhase('exercise');
  };

  const finishNow = async () => {
    setPhase('complete');
    setAiLoading(true);
    const totalSets = logs.reduce((a,l)=>a+l.sets.length,0);
    const summary = `メニュー「${routineName(routine, level)}」(${levelById(level).label}レベル)を実施。種目数${logs.length}、合計セット数${totalSets}。`;
    const msg = await fetchEncouragement(summary);
    setAiMessage(msg || FALLBACK_MESSAGES[Math.floor(Math.random()*FALLBACK_MESSAGES.length)]);
    setAiLoading(false);
  };

  const save = () => {
    const durationMin = Math.max(1, Math.round((Date.now()-startTime.current)/60000));
    const totalCount = logs.reduce((a,l)=>a+l.sets.length,0);
    onSave({
      id:'w_'+Date.now(),
      date: toDateStr(new Date()),
      routineName: routineName(routine, level),
      level,
      durationMin,
      mood, note,
      exercises: logs,
      totalSets: totalCount,
      bodyWeightKg: profile?.weight || null,
    });
  };

  if (phase==='rest') {
    const pct = restTotal>0 ? (restLeft/restTotal)*100 : 0;
    return (
      <div className="min-h-[70vh] flex flex-col items-center justify-center text-center space-y-6 px-4">
        <p className="text-sm font-bold text-forest-600">ひとやすみ。深呼吸してみましょう</p>
        <div className="relative w-40 h-40 flex items-center justify-center">
          <svg className="w-40 h-40 -rotate-90">
            <circle cx="80" cy="80" r="70" stroke="#EAF3EF" strokeWidth="10" fill="none" />
            <circle cx="80" cy="80" r="70" stroke="#2F6F5E" strokeWidth="10" fill="none"
              strokeDasharray={2*Math.PI*70} strokeDashoffset={2*Math.PI*70*(1-pct/100)} className="transition-all duration-1000" strokeLinecap="round" />
          </svg>
          <span className="absolute text-3xl font-display font-black text-forest-700">{restLeft}</span>
        </div>
        <div className="flex items-center gap-3">
          <button onClick={()=>{ setRestLeft(l=>l+30); setRestTotal(t=>t+30); }}
            className="px-4 py-2 rounded-full bg-white border-2 border-forest-200 text-forest-600 text-xs font-bold">＋30秒</button>
          <button onClick={()=>{ setRestLeft(0); setPhase(afterRest); }} className="text-xs font-bold text-slate-400 underline">休憩をとばす</button>
        </div>
      </div>
    );
  }

  if (phase==='bonus') {
    return (
      <div className="min-h-[60vh] flex flex-col items-center justify-center text-center space-y-6 px-6">
        <div className="text-5xl">🌿</div>
        <h2 className="text-lg font-display font-black text-forest-700">ここまで、よく頑張りました！</h2>
        <p className="text-sm text-slate-500">もう少しだけ、続けてみますか？</p>
        <div className="w-full space-y-3">
          <button onClick={handleWantBonus} className="w-full py-3.5 bg-forest-600 hover:bg-forest-700 text-white font-black text-sm rounded-2xl soft-shadow">もう1種目やってみる</button>
          <button onClick={finishNow} className="w-full py-3.5 bg-white border border-slate-200 text-slate-600 font-bold text-sm rounded-2xl">ここまでにする</button>
        </div>
        {showBonusPicker && (
          <BonusPickerModal
            pool={availablePool.filter(e => !exercises.find(x=>x.id===e.id))}
            favorites={favorites}
            onClose={()=>setShowBonusPicker(false)}
            onSelect={addSelectedExercise}
          />
        )}
      </div>
    );
  }

  if (phase==='complete') {
    const totalCount = logs.reduce((a,l)=>a+l.sets.length,0);
    const kcal = profile?.weight ? Math.round(caloriesForWorkout({ exercises: logs }, profile.weight)) : null;
    return (
      <div className="min-h-[70vh] relative space-y-5 px-1">
        <ConfettiBurst />
        <div className="text-center pt-4">
          <div className="text-5xl">🎉</div>
          <h2 className="text-xl font-display font-black text-forest-700 mt-2">おつかれさまでした！</h2>
          <p className="text-sm text-slate-500 mt-1">今日は{logs.length}種目・合計{totalCount}セット、がんばりました</p>
          {kcal!==null ? (
            <p className="text-xs font-bold text-coral-600 mt-1"><i className="fas fa-fire mr-1"></i>推定消費カロリー: 約{kcal}kcal</p>
          ) : (
            <p className="text-[11px] font-bold text-slate-400 mt-1">プロフィール(体重)を設定すると消費カロリーの目安が出せます</p>
          )}
        </div>

        <div className="bg-white rounded-2xl p-4 soft-shadow min-h-[64px] flex items-center gap-3">
          {aiLoading ? (
            <p className="text-xs text-slate-400 font-bold">応援メッセージを準備中...</p>
          ) : (
            <p className="text-sm text-forest-700 font-bold leading-relaxed">{aiMessage}</p>
          )}
        </div>

        <div className="bg-white rounded-2xl p-4 soft-shadow space-y-3">
          <p className="text-xs font-bold text-slate-500">今日の気分は？(任意)</p>
          <div className="flex justify-center gap-4">
            {['😊','😐','😣'].map(e => (
              <button key={e} onClick={()=>setMood(e)}
                className={`w-14 h-14 rounded-2xl text-2xl flex items-center justify-center transition-all ${mood===e ? 'bg-coral-50 border-2 border-coral-500 scale-110' : 'bg-sand-50 border-2 border-transparent'}`}>{e}</button>
            ))}
          </div>
          <textarea value={note} onChange={(e)=>setNote(e.target.value)} rows="2" placeholder="ひとこと日記(任意)"
            className="w-full bg-sand-50 border border-sand-100 rounded-xl p-3 text-xs focus:outline-none focus:border-forest-300" />
        </div>

        <button onClick={save} className="w-full py-3.5 bg-forest-600 hover:bg-forest-700 text-white font-black text-sm rounded-2xl soft-shadow">きろくを保存する</button>
      </div>
    );
  }

  /* exercise phase */
  const bp = bodyPartOf(current.bodyPart);
  return (
    <div className="space-y-5 pb-4">
      <div className="flex items-center justify-between">
        <button onClick={onCancel} className="text-xs font-bold text-slate-400">やめる</button>
        <p className="text-xs font-bold text-slate-400">{exIndex+1} / {exercises.length} 種目め</p>
      </div>

      <div className="flex items-center justify-center gap-2">
        <div className="flex gap-1.5">
          {exercises.map((_,i)=>(
            <button key={i} onClick={()=>jumpToExercise(i)}
              className={`h-1.5 rounded-full transition-all ${i<exIndex ? 'w-6 bg-forest-500' : i===exIndex ? 'w-10 bg-coral-500' : 'w-6 bg-sand-100'}`}></button>
          ))}
        </div>
      </div>
      <button onClick={()=>setShowSwitcher(true)} className="block mx-auto text-[11px] font-bold text-forest-600 bg-forest-50 px-3 py-1.5 rounded-full">
        <i className="fas fa-shuffle mr-1"></i>種目を変更する
      </button>

      <div className="bg-white rounded-3xl p-6 soft-shadow text-center pop-in" key={current.id+exIndex}>
        <span className="text-[11px] font-bold px-2 py-0.5 rounded-full inline-block" style={{ backgroundColor:`${bp.color}1A`, color:bp.color }}>{bp.name}</span>
        <div className="w-16 h-16 mx-auto mt-3 rounded-2xl bg-forest-50 text-forest-600 flex items-center justify-center text-2xl">
          <i className={`fas ${current.icon}`}></i>
        </div>
        <h2 className="text-xl font-display font-black text-slate-800 mt-3">{current.name}</h2>
        <p className="text-xs text-slate-500 mt-2 leading-relaxed">{current.tip}</p>
        <div className="flex items-center justify-center gap-2 mt-3">
          <button onClick={()=>adjustTargetSets(-1)} className="w-6 h-6 rounded-full bg-white border border-forest-200 text-forest-600 text-xs font-bold flex items-center justify-center">−</button>
          <p className="text-xs font-bold text-forest-500">{setIndex+1} / {current.sets} セットめ</p>
          <button onClick={()=>adjustTargetSets(1)} className="w-6 h-6 rounded-full bg-white border border-forest-200 text-forest-600 text-xs font-bold flex items-center justify-center">＋</button>
        </div>
        {previous ? (
          <div className="inline-flex items-center gap-1.5 bg-sand-50 rounded-full px-3 py-1.5 mt-3">
            <i className="fas fa-clock-rotate-left text-[10px] text-slate-400"></i>
            <span className="text-[11px] font-bold text-slate-500">前回({formatFriendly(previous.date)}): {formatSetsSummary(previous.sets, current.unit)}</span>
          </div>
        ) : (
          <div className="inline-flex items-center gap-1.5 bg-sand-50 rounded-full px-3 py-1.5 mt-3">
            <span className="text-[11px] font-bold text-slate-400">はじめての記録になります</span>
          </div>
        )}
      </div>

      <div className="bg-white rounded-3xl p-6 soft-shadow space-y-4">
        {isBeatingPrevious && (
          <p className="text-center text-xs font-bold text-forest-600"><i className="fas fa-arrow-trend-up mr-1"></i>前回を上回っています！</p>
        )}
        {current.unit === '秒' ? (
          <div className="text-center space-y-4">
            <div className="relative w-40 h-40 mx-auto flex items-center justify-center">
              <svg className="w-40 h-40 -rotate-90">
                <circle cx="80" cy="80" r="70" stroke="#EAF3EF" strokeWidth="10" fill="none" />
                <circle cx="80" cy="80" r="70" stroke="#FF8B6B" strokeWidth="10" fill="none"
                  strokeDasharray={2*Math.PI*70} strokeDashoffset={2*Math.PI*70*(1-Math.min(1,timerElapsed/value))} className="transition-all duration-1000" strokeLinecap="round" />
              </svg>
              <div className="absolute text-center">
                <span className="text-3xl font-display font-black text-forest-700">{timerElapsed}</span>
                <span className="text-xs font-bold text-forest-300 block">/ {value}秒</span>
              </div>
            </div>
            {!timerRunning && timerElapsed===0 && (
              <div className="space-y-1">
                <p className="text-[11px] font-bold text-slate-400 text-center">目標時間を調整</p>
                <Stepper value={value} onChange={(v)=>setValue(Math.max(5, v))} step={5} min={5} unit="秒" />
              </div>
            )}
            <div className="flex gap-2">
              {!timerRunning ? (
                <button onClick={()=>{ unlockAudio(); setTimerRunning(true); }} className="flex-1 py-3.5 bg-coral-500 hover:bg-coral-600 text-white font-black text-sm rounded-2xl">
                  <i className="fas fa-play mr-1"></i>{timerElapsed===0 ? 'スタート' : '再開'}
                </button>
              ) : (
                <button onClick={()=>setTimerRunning(false)} className="flex-1 py-3.5 bg-white border-2 border-forest-200 text-forest-600 font-black text-sm rounded-2xl">
                  <i className="fas fa-pause mr-1"></i>一時停止
                </button>
              )}
              {timerElapsed>0 && (
                <button onClick={()=>{ setTimerRunning(false); logSet(); }} className="flex-1 py-3.5 bg-forest-600 hover:bg-forest-700 text-white font-black text-sm rounded-2xl">
                  ここで記録する
                </button>
              )}
            </div>
          </div>
        ) : (
          <Stepper value={value} onChange={setValue} step={1} min={1} unit={current.unit} />
        )}
        <div className="flex items-center justify-center gap-2">
          <button onClick={()=>setUseWeight(!useWeight)}
            className={`text-xs font-bold px-3 py-1.5 rounded-full border transition-colors ${useWeight ? 'bg-forest-50 border-forest-300 text-forest-700' : 'bg-white border-slate-200 text-slate-400'}`}>
            <i className="fas fa-dumbbell mr-1"></i>重りを使う
          </button>
        </div>
        {useWeight && (
          <div className="space-y-3">
            <Stepper value={weight} onChange={setWeight} step={0.5} min={0.5} unit="kg" />
            <div className="flex flex-wrap justify-center gap-1.5">
              {[1.25,2.5,5,10,20].map(p => (
                <button key={p} onClick={()=>setWeight(w=>Math.round((w+p)*100)/100)}
                  className="px-3 py-1.5 rounded-full bg-sand-50 border border-sand-100 text-xs font-bold text-forest-600">+{p}kg</button>
              ))}
              <button onClick={()=>setWeight(2)} className="px-3 py-1.5 rounded-full bg-white border border-slate-200 text-xs font-bold text-slate-400">リセット</button>
            </div>
          </div>
        )}
      </div>

      {current.unit !== '秒' && (
        <button onClick={logSet} className="w-full py-4 bg-coral-500 hover:bg-coral-600 text-white font-black text-base rounded-2xl soft-shadow active:scale-95 transition-transform">
          できた！
        </button>
      )}

      {showSwitcher && (
        <ExerciseSwitcherModal exercises={exercises} logs={logs} currentIndex={exIndex}
          onClose={()=>setShowSwitcher(false)} onSelect={jumpToExercise} onRemove={removeExerciseAt}
          onAddNew={()=>{ setShowSwitcher(false); setShowBonusPicker(true); }} />
      )}
      {showBonusPicker && (
        <BonusPickerModal
          pool={availablePool.filter(e => !exercises.find(x=>x.id===e.id))}
          favorites={favorites}
          onClose={()=>setShowBonusPicker(false)}
          onSelect={addSelectedExercise}
        />
      )}
    </div>
  );
}

function HistoryView({ workouts, onDelete, onUpdate }) {
  const week = last7Days(workouts);

  const [detailWorkout, setDetailWorkout] = useState(null);
  if (workouts.length===0) {
    return (
      <div className="bg-white rounded-2xl p-8 text-center soft-shadow">
        <p className="text-sm text-slate-400 font-bold">まだきろくがありません。<br/>今日から少しずつ、記録していきましょう。</p>
      </div>
    );
  }
  return (
    <div className="space-y-5">
      <div className="bg-white rounded-2xl p-4 soft-shadow flex justify-between">
        {week.map(d => (
          <div key={d.date} className="flex flex-col items-center gap-1.5">
            <span className="text-[10px] font-bold text-slate-400">{d.label}</span>
            <div className={`w-7 h-7 rounded-full flex items-center justify-center text-[10px] font-black ${d.done ? 'bg-forest-500 text-white' : 'bg-sand-100 text-slate-300'}`}>
              {d.done ? <i className="fas fa-check"></i> : ''}
            </div>
          </div>
        ))}
      </div>
      {groups.map(({ date, items }) => (
        <div key={date} className="space-y-2">
          <div className="flex items-center gap-2 px-1">
            <span className="text-xs font-black text-forest-600 bg-forest-50 px-2.5 py-1 rounded-full">{formatFriendly(date)}</span>
            {items.length>1 && <span className="text-[11px] font-bold text-slate-400">{items.length}回のトレーニング</span>}
          </div>
          <div className="space-y-3 border-l-2 border-forest-100 pl-3">
            {items.map(w => {
              const kcal = w.bodyWeightKg ? Math.round(caloriesForWorkout(w, w.bodyWeightKg)) : null;
              return (
              <div key={w.id} className="bg-white rounded-2xl p-4 soft-shadow space-y-2">
                <div className="flex justify-between items-start">
                  <div>
                    <div className="flex items-center gap-2">
                      {w.level && <span className="text-[11px] font-bold text-slate-400">{levelById(w.level).label}</span>}
                      {w.mood && <span className="text-base">{w.mood}</span>}
                    </div>
                    <h3 className="text-sm font-black text-slate-800 mt-1">{w.routineName}</h3>
                    <p className="text-xs text-slate-500 mt-0.5">{w.exercises.length}種目・がんばった回数 {w.totalSets}セット・{w.durationMin}分{kcal!==null && ` ・ 約${kcal}kcal`}</p>
                  </div>
                  <button onClick={()=>onDelete(w.id)} className="text-slate-300 hover:text-coral-500 p-1"><i className="fas fa-trash-alt text-sm"></i></button>
                </div>
                {w.note && <p className="text-xs text-slate-600 bg-sand-50 rounded-lg p-2.5">💬 {w.note}</p>}
                <div className="flex flex-wrap gap-1.5 pt-1">
                  {w.exercises.map((e,i)=>(
                    <span key={i} className="text-[10px] font-bold px-2 py-1 rounded-full bg-sand-50 text-slate-600">{e.name}</span>
                  ))}
                </div>
                <div className="flex items-center gap-2 pt-1">
                  <button onClick={()=>setDetailWorkout(w)} className="flex-1 text-[11px] font-bold text-forest-600 text-center py-1.5 bg-sand-50 rounded-lg">
                    詳細を見る・編集する
                  </button>
                  <button onClick={()=>shareOrDownloadImage(w)} className="flex-1 text-[11px] font-bold text-coral-600 text-center py-1.5 bg-coral-50 rounded-lg">
                    <i className="fas fa-image mr-1"></i>画像で保存・共有
                  </button>
                </div>
              </div>
              );
            })}
          </div>
        </div>
      ))}
      {detailWorkout && (
        <WorkoutDetailModal
          workout={detailWorkout}
          onClose={()=>setDetailWorkout(null)}
          onSave={(updated)=>{ onUpdate(updated); setDetailWorkout(null); }}
        />
      )}
    </div>
  );
}

/* ---------- library ---------- */
function CustomExerciseModal({ onClose, onSave }) {
  const [name, setName] = useState('');
  const [bodyPart, setBodyPart] = useState('chest');
  const [sets, setSets] = useState(2);
  const [reps, setReps] = useState(10);
  const [unit, setUnit] = useState('回');

    if (!name.trim()) return;
    onSave({
      id: 'custom_' + Date.now(),
      name: name.trim(),
      bodyPart,
      icon: 'fa-dumbbell',
      sets,
      reps,
      unit,
      difficulty,
      tip: tip.trim() || '自分のオリジナル運動です。',
      restSet: 60,
    });

  return (
    <div className="fixed inset-0 z-50 bg-slate-800/40 backdrop-blur-sm flex items-center justify-center p-6">
      <div className="bg-white rounded-3xl max-w-sm w-full p-5 space-y-4 soft-shadow">
        <div className="flex justify-between items-center">
          <h4 className="text-sm font-black text-slate-800">カスタム種目の追加</h4>
          <button onClick={onClose} className="text-slate-400 p-1"><i className="fas fa-times"></i></button>

          <div>
            <label className="font-bold text-slate-500 block mb-1">種目名</label>

          </div>
          <div>
            <label className="font-bold text-slate-500 block mb-1">部位</label>
            <select value={bodyPart} onChange={e=>setBodyPart(e.target.value)} className="w-full bg-sand-50 border border-sand-100 rounded-xl p-2.5">
              {BODY_PARTS.map(b => <option key={b.id} value={b.id}>{b.name}</option>)}

          </div>

            <div className="flex-1">
              <label className="font-bold text-slate-500 block mb-1">セット数</label>
              <input type="number" value={sets} onChange={e=>setSets(parseInt(e.target.value)||1)} className="w-full bg-sand-50 border border-sand-100 rounded-xl p-2.5" />
            </div>
            <div className="flex-1">
              <label className="font-bold text-slate-500 block mb-1">回数 / 秒数</label>
              <input type="number" value={reps} onChange={e=>setReps(parseInt(e.target.value)||1)} className="w-full bg-sand-50 border border-sand-100 rounded-xl p-2.5" />

                <option value="秒">秒</option>
              </select>
            </div>
          </div>
          <div>
            <label className="font-bold text-slate-500 block mb-1">コツ・アドバイス</label>
            <input type="text" value={tip} onChange={e=>setTip(e.target.value)} placeholder="姿勢や注意点など" className="w-full bg-sand-50 border border-sand-100 rounded-xl p-2.5" />
          </div>
        </div>
        <button onClick={handleSave} className="w-full py-3.5 bg-coral-500 hover:bg-coral-600 text-white font-black text-xs rounded-2xl">登録する</button>
      </div>
    </div>
  );
}

function LibraryView({ level, onLevelChange, customExercises, favorites, onToggleFavorite, onAddCustom, onDeleteCustom }) {
  const [filter, setFilter] = useState('all');
  const [showModal, setShowModal] = useState(false);
  const isFav = (id) => favorites.includes(id);

    : filter==='favorites' ? builtInUnlocked.filter(fam=>isFav(fam.id))

    <button onClick={()=>onToggleFavorite(id)} className="text-base leading-none px-0.5">
      <i className={`${isFav(id) ? 'fas' : 'far'} fa-star`} style={{ color: isFav(id) ? '#FFC857' : '#CBD5C9' }}></i>

  return (
    <div className="space-y-4">
      <div className="flex items-center justify-between">
        <h2 className="text-lg font-display font-black text-forest-700">うんどうずかん</h2>

          <i className="fas fa-plus mr-1"></i>追加

      <LevelSelector level={level} onChange={onLevelChange} />
      <p className="text-xs text-slate-400 font-bold -mt-2">目安は「{levelById(level).label}」レベルで表示しています</p>
      <div className="flex gap-2 overflow-x-auto pb-1">
        <button onClick={()=>setFilter('favorites')} className={`px-3 py-1.5 rounded-full text-xs font-bold whitespace-nowrap border ${filter==='favorites' ? 'bg-gold-500 text-white border-gold-500' : 'bg-white text-slate-500 border-slate-200'}`}>
          <i className="fas fa-star mr-1"></i>お気に入り
        </button>
        <button onClick={()=>setFilter('all')} className={`px-3 py-1.5 rounded-full text-xs font-bold whitespace-nowrap border ${filter==='all' ? 'bg-forest-600 text-white border-forest-600' : 'bg-white text-slate-500 border-slate-200'}`}>すべて</button>
        {BODY_PARTS.map(bp => (
          <button key={bp.id} onClick={()=>setFilter(bp.id)} className={`px-3 py-1.5 rounded-full text-xs font-bold whitespace-nowrap border ${filter===bp.id ? 'text-white border-transparent' : 'bg-white text-slate-500 border-slate-200'}`}
            style={filter===bp.id ? { backgroundColor:bp.color } : {}}>{bp.name}</button>
        ))}
      </div>
      <div className="space-y-3">
        {filter==='favorites' && customList.length===0 && builtIn.length===0 && (

        )}
        {customList.map(ce => {
          const bp = bodyPartOf(ce.bodyPart);
          return (
            <div key={ce.id} className="bg-white rounded-2xl p-4 soft-shadow flex gap-3">
              <div className="w-11 h-11 rounded-xl flex items-center justify-center text-lg flex-shrink-0" style={{ backgroundColor:`${bp.color}1A`, color:bp.color }}>
                <i className={`fas ${ce.icon}`}></i>
              </div>
              <div className="flex-1">
                <div className="flex items-center justify-between">
                  <h3 className="text-sm font-black text-slate-800">{ce.name} <span className="text-[9px] font-bold text-coral-500">カスタム</span></h3>
                  <div className="flex items-center gap-2">
                    <FavToggle id={ce.id} />
                    <DifficultyBadge level={ce.difficulty} />
                    <button onClick={()=>onDeleteCustom(ce.id)} className="text-slate-300 hover:text-coral-500"><i className="fas fa-trash-alt text-xs"></i></button>
                  </div>
                </div>
                <p className="text-xs text-slate-500 mt-1 leading-relaxed">{ce.tip}</p>
                <p className="text-[11px] text-forest-500 font-bold mt-1">目安: {ce.sets}セット × {ce.reps}{ce.unit} ・ 休憩{ce.restSet || 30}秒</p>
              </div>
            </div>
          );
        })}
        {builtIn.map(fam => {
          const bp = bodyPartOf(fam.bodyPart);
          const v = resolveExercise(fam.id, level);
          return (
            <div key={fam.id} className="bg-white rounded-2xl p-4 soft-shadow flex gap-3">
              <div className="w-11 h-11 rounded-xl flex items-center justify-center text-lg flex-shrink-0" style={{ backgroundColor:`${bp.color}1A`, color:bp.color }}>
                <i className={`fas ${fam.icon}`}></i>
              </div>
              <div className="flex-1">
                <div className="flex items-center justify-between">
                  <h3 className="text-sm font-black text-slate-800">{v.name}</h3>
                  <div className="flex items-center gap-2">
                    <FavToggle id={fam.id} />
                    <DifficultyBadge level={v.difficulty} />
                  </div>
                </div>
                <p className="text-xs text-slate-500 mt-1 leading-relaxed">{v.tip}</p>
                <p className="text-[11px] text-forest-500 font-bold mt-1">目安: {v.sets}セット × {v.reps}{v.unit} ・ 休憩{v.restSet || REST_SET}秒</p>
              </div>
            </div>
          );
        })}
      </div>
      {showModal && (
        <CustomExerciseModal onClose={()=>setShowModal(false)} onSave={(ex)=>{ onAddCustom(ex); setShowModal(false); }} />
      )}
    </div>
  );
}

/* ---------- collection ---------- */
function CollectionView({ workouts, onBack }) {
  const totalDays = totalTrainedDays(workouts);
  return (
    <div className="space-y-4">
      <button onClick={onBack} className="text-xs font-bold text-slate-400"><i className="fas fa-arrow-left mr-1"></i>もどる</button>
      <h2 className="text-lg font-display font-black text-forest-700">そだてノート</h2>
      <p className="text-xs text-slate-400 font-bold -mt-2">合計トレーニング日数: {totalDays}日(連続でなくてもカウントされます)</p>
      <div className="grid grid-cols-2 gap-3">
        {MILESTONES.map(m => {
          const unlocked = totalDays >= m.days;
          return (
            <div key={m.id} className={`rounded-2xl p-4 text-center soft-shadow ${unlocked ? 'bg-white' : 'bg-sand-50'}`}>
              <div className={`text-4xl ${unlocked ? '' : 'opacity-30 grayscale'}`}>{unlocked ? m.emoji : '❔'}</div>
              <p className={`text-xs font-black mt-2 ${unlocked ? 'text-forest-700' : 'text-slate-300'}`}>{unlocked ? m.label : '？？？'}</p>
              <p className="text-[10px] text-slate-400 font-bold mt-0.5">{unlocked ? `${m.days}日で仲間入り` : `${m.days}日で解放`}</p>
            </div>
          );
        })}
      </div>
    </div>
  );
}

function MilestoneRevealOverlay({ milestone, onClose }) {
  return (
    <div className="fixed inset-0 z-50 bg-forest-700/70 backdrop-blur-sm flex items-center justify-center p-6" onClick={onClose}>
      <div className="relative bg-white rounded-3xl p-8 max-w-xs w-full text-center soft-shadow pop-in overflow-hidden" onClick={e=>e.stopPropagation()}>
        <ConfettiBurst />
        <p className="text-xs font-bold text-coral-500">合計{milestone.days}日達成！</p>
        <div className="text-7xl my-3">{milestone.emoji}</div>
        <h3 className="text-lg font-display font-black text-forest-700">「{milestone.label}」が仲間入り</h3>
        <p className="text-xs text-slate-500 mt-2">そだてノートに新しいなかまが増えました🎉</p>
        <button onClick={onClose} className="mt-5 w-full py-3 bg-forest-600 text-white font-bold text-sm rounded-2xl">やったね！</button>
      </div>
    </div>

}

/* ---------- backup & import ---------- */
function BackupModal({ exportData, onImport, onClose }) {
  const fileInputRef = useRef(null);
  const [importMode, setImportMode] = useState('merge'); // 'merge' | 'overwrite'
  const [status, setStatus] = useState(null); // null | { type:'success', msg:string } | { type:'error', msg:string }

  const handleExport = () => {
    const json = JSON.stringify(exportData, null, 2);
    const blob = new Blob([json], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `yurutore-backup-${toDateStr(new Date())}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  };

  const handleFileChange = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const data = JSON.parse(ev.target.result);
        const res = onImport(data, importMode);
        setStatus({
          type: 'success',
          msg: importMode === 'merge'
            ? `インポート完了！ (新しく${res.addedWorkoutsCount}件の記録を追加・統合しました)`
            : `インポート完了！ (全データを上書き更新しました)`
        });
      } catch (err) {
        setStatus({ type: 'error', msg: '読み込みに失敗しました。正しいJSONファイルか確認してください。' });
      }
    };
    reader.readAsText(file);
    e.target.value = '';
  };

  return (
    <div className="fixed inset-0 z-50 bg-slate-800/40 backdrop-blur-sm flex items-center justify-center p-6">
      <div className="bg-white rounded-3xl max-w-sm w-full p-5 space-y-4 soft-shadow">
        <div className="flex justify-between items-center">
          <h4 className="text-sm font-black text-slate-800">データのバックアップ・取込</h4>
          <button onClick={onClose} className="text-slate-400 p-1"><i className="fas fa-times"></i></button>
        </div>
        <p className="text-[11px] text-slate-400 font-bold leading-relaxed">
          機種変更時や他端末からのデータ移行にお使いいただけます。
        </p>

        <div className="bg-sand-50 rounded-2xl p-3 space-y-2">
          <p className="text-xs font-black text-slate-700"><i className="fas fa-download text-forest-600 mr-1.5"></i>この端末のデータを保存</p>
          <button onClick={handleExport} className="w-full py-2.5 bg-forest-600 hover:bg-forest-700 text-white font-black text-xs rounded-xl transition-colors">
            バックアップファイルを書き出す
          </button>
        </div>

        <div className="bg-sand-50 rounded-2xl p-3 space-y-2.5">
          <p className="text-xs font-black text-slate-700"><i className="fas fa-upload text-coral-600 mr-1.5"></i>別端末のデータを読み込む</p>
          
          <div className="flex gap-1.5 bg-white p-1 rounded-xl border border-sand-100 text-[10px] font-bold">
            <button onClick={()=>setImportMode('merge')}
              className={`flex-1 py-1.5 rounded-lg transition-colors ${importMode==='merge' ? 'bg-forest-500 text-white' : 'text-slate-400'}`}>
              追加・統合（現在の記録を維持）
            </button>
            <button onClick={()=>setImportMode('overwrite')}
              className={`flex-1 py-1.5 rounded-lg transition-colors ${importMode==='overwrite' ? 'bg-coral-500 text-white' : 'text-slate-400'}`}>
              上書き（全置換）
            </button>
          </div>

          <button onClick={()=>fileInputRef.current?.click()} className="w-full py-2.5 bg-white border-2 border-coral-300 hover:border-coral-500 text-coral-600 font-black text-xs rounded-xl transition-colors">
            ファイルを選択して読み込む
          </button>
          <input ref={fileInputRef} type="file" accept="application/json" className="hidden" onChange={handleFileChange} />
        </div>

        {status && (
          <div className={`p-3 rounded-xl text-xs font-bold leading-snug ${status.type==='success' ? 'bg-forest-50 text-forest-700 border border-forest-200' : 'bg-coral-50 text-coral-600 border border-coral-200'}`}>
            {status.msg}
          </div>
        )}
      </div>
    </div>
  );
}

function ProfileModal({ profile, onClose, onSave }) {
  const [gender, setGender] = useState(profile?.gender || 'unspecified');
  const [age, setAge] = useState(profile?.age || 30);
  const [height, setHeight] = useState(profile?.height || 165);
  const [weight, setWeight] = useState(profile?.weight || 60);

  const handleSave = () => {
    onSave({
      gender,
      age: parseInt(age)||30,
      height: parseFloat(height)||165,
      weight: parseFloat(weight)||60,
    });
  };

  return (
    <div className="fixed inset-0 z-50 bg-slate-800/40 backdrop-blur-sm flex items-center justify-center p-6">
      <div className="bg-white rounded-3xl max-w-sm w-full p-5 space-y-4 soft-shadow">
        <div className="flex justify-between items-center">
          <h4 className="text-sm font-black text-slate-800">プロフィール設定</h4>
          <button onClick={onClose} className="text-slate-400 p-1"><i className="fas fa-times"></i></button>
        </div>
        <p className="text-[11px] text-slate-400 font-bold leading-relaxed">
          体重を入力しておくと、トレーニング時の推定消費カロリーが自動で計算されます。
        </p>

        <div className="space-y-3 text-xs">
          <div>
            <label className="font-bold text-slate-500 block mb-1">体重 (kg)</label>
            <input type="number" step="0.1" value={weight} onChange={e=>setWeight(e.target.value)} className="w-full bg-sand-50 border border-sand-100 rounded-xl p-2.5 font-bold text-forest-700 focus:outline-none" />
          </div>
          <div className="flex gap-2">
            <div className="flex-1">
              <label className="font-bold text-slate-500 block mb-1">身長 (cm)</label>
              <input type="number" value={height} onChange={e=>setHeight(e.target.value)} className="w-full bg-sand-50 border border-sand-100 rounded-xl p-2.5 focus:outline-none" />
            </div>
            <div className="flex-1">
              <label className="font-bold text-slate-500 block mb-1">年齢</label>
              <input type="number" value={age} onChange={e=>setAge(e.target.value)} className="w-full bg-sand-50 border border-sand-100 rounded-xl p-2.5 focus:outline-none" />
            </div>
          </div>
        </div>

        <button onClick={handleSave} className="w-full py-3.5 bg-forest-600 hover:bg-forest-700 text-white font-black text-xs rounded-2xl">保存する</button>
      </div>
    </div>
  );
}

/* ---------- main app ---------- */
function App() {
  const [workouts, setWorkouts] = useState([]);
  const [level, setLevel] = useState('beginner');
  const [focusMode, setFocusMode] = useState(false);
  const [customExercises, setCustomExercises] = useState([]);
  const [myRoutines, setMyRoutines] = useState([]);
  const [favorites, setFavorites] = useState([]);
  const [profile, setProfile] = useState(null);

  const [tab, setTab] = useState('home');
  const [view, setView] = useState('home'); // home | picker | session | collection
  const [selectedRoutine, setSelectedRoutine] = useState(null);
  const [activeModal, setActiveModal] = useState(null); // backup | profile | null
  const [unlockedMilestone, setUnlockedMilestone] = useState(null);

  useEffect(() => {
    (async () => {
      const [w, l, f, c, r, fav, p] = await Promise.all([
        loadWorkouts(), loadLevel(), loadFocusMode(),
        loadCustomExercises(), loadMyRoutines(), loadFavorites(), loadProfile()
      ]);
      if (w) setWorkouts(w);
      if (l) setLevel(l);
      if (f !== null) setFocusMode(f);
      if (c) setCustomExercises(c);
      if (r) setMyRoutines(r);
      if (fav) setFavorites(fav);
      if (p) setProfile(p);
    })();
  }, []);

  const handleLevelChange = (lvl) => {
    setLevel(lvl);
    persistLevel(lvl);
  };

  const handleToggleFocus = () => {
    const next = !focusMode;
    setFocusMode(next);
    persistFocusMode(next);
  };

  const handleAddCustomExercise = (ex) => {
    const next = [...customExercises, ex];
    setCustomExercises(next);
    persistCustomExercises(next);
  };

  const handleDeleteCustomExercise = (id) => {
    const next = customExercises.filter(c=>c.id!==id);
    setCustomExercises(next);
    persistCustomExercises(next);
  };

  const handleToggleFavorite = (id) => {
    const next = favorites.includes(id) ? favorites.filter(x=>x!==id) : [...favorites, id];
    setFavorites(next);
    persistFavorites(next);
  };

  const handleDeleteMyRoutine = (id) => {
    const next = myRoutines.filter(r=>r.id!==id);
    setMyRoutines(next);
    persistMyRoutines(next);
  };

  const handleSaveWorkout = (newWorkout) => {
    const prevDays = totalTrainedDays(workouts);
    const nextWorkouts = [newWorkout, ...workouts];
    const nextDays = totalTrainedDays(nextWorkouts);

    setWorkouts(nextWorkouts);
    persistWorkouts(nextWorkouts);

    const newlyCrossed = crossedMilestones(prevDays, nextDays);
    if (newlyCrossed.length > 0) {
      setUnlockedMilestone(newlyCrossed[0]);
    }

    setView('home');
    setTab('history');
  };

  const handleDeleteWorkout = (id) => {
    const next = workouts.filter(w=>w.id!==id);
    setWorkouts(next);
    persistWorkouts(next);
  };

  const handleUpdateWorkout = (updated) => {
    const next = workouts.map(w=>w.id===updated.id ? updated : w);
    setWorkouts(next);
    persistWorkouts(next);
  };

  const handleImportData = (importedData, mode='merge') => {
    if (!importedData || typeof importedData !== 'object') {
      throw new Error('Invalid format');
    }

    const impWorkouts = Array.isArray(importedData) ? importedData : (importedData.workouts || []);
    const impLevel = importedData.level || level;
    const impCustomEx = importedData.customExercises || [];
    const impMyRoutines = importedData.myRoutines || [];
    const impFavs = importedData.favorites || [];
    const impProfile = importedData.profile || profile;

    let mergedWorkouts, mergedCustomEx, mergedMyRoutines, mergedFavs;

    if (mode === 'overwrite') {
      mergedWorkouts = impWorkouts;
      mergedCustomEx = impCustomEx;
      mergedMyRoutines = impMyRoutines;
      mergedFavs = impFavs;
    } else {
      const existingWorkoutIds = new Set(workouts.map(w => w.id));
      const newWorkouts = impWorkouts.filter(w => !existingWorkoutIds.has(w.id));
      mergedWorkouts = [...workouts, ...newWorkouts].sort((a, b) => b.date.localeCompare(a.date));

      const existingCustomIds = new Set(customExercises.map(c => c.id));
      mergedCustomEx = [...customExercises, ...impCustomEx.filter(c => !existingCustomIds.has(c.id))];

      const existingRoutineIds = new Set(myRoutines.map(r => r.id));
      mergedMyRoutines = [...myRoutines, ...impMyRoutines.filter(r => !existingRoutineIds.has(r.id))];

      mergedFavs = Array.from(new Set([...favorites, ...impFavs]));
    }

    setWorkouts(mergedWorkouts);
    persistWorkouts(mergedWorkouts);

    if (impLevel) { setLevel(impLevel); persistLevel(impLevel); }
    setCustomExercises(mergedCustomEx); persistCustomExercises(mergedCustomEx);
    setMyRoutines(mergedMyRoutines); persistMyRoutines(mergedMyRoutines);
    setFavorites(mergedFavs); persistFavorites(mergedFavs);

    if (impProfile) { setProfile(impProfile); persistProfile(impProfile); }

    const addedCount = mode === 'overwrite' ? mergedWorkouts.length : mergedWorkouts.length - workouts.length;
    return { addedWorkoutsCount: addedCount, totalWorkoutsCount: mergedWorkouts.length };
  };

  const exportPayload = {
    workouts,
    level,
    focusMode,
    customExercises,
    myRoutines,
    favorites,
    profile,
    exportedAt: new Date().toISOString()
  };

  return (
    <div className={`min-h-screen pb-24 ${focusMode ? 'bg-slate-100 text-slate-800' : ''}`}>
      <main className="max-w-md mx-auto p-4">
        {view === 'session' ? (
          <SessionView
            routine={selectedRoutine}
            level={level}
            customExercises={customExercises}
            favorites={favorites}
            workouts={workouts}
            profile={profile}
            onCancel={()=>setView('home')}
            onSave={handleSaveWorkout}
          />
        ) : view === 'picker' ? (
          <PickerView
            level={level}
            onLevelChange={handleLevelChange}
            customExercises={customExercises}
            myRoutines={myRoutines}
            onDeleteMyRoutine={handleDeleteMyRoutine}
            onStart={(r)=>{ setSelectedRoutine(r); setView('session'); }}
            onBack={()=>setView('home')}
            onBuildCustom={()=>{}}
          />
        ) : view === 'collection' ? (
          <CollectionView workouts={workouts} onBack={()=>setView('home')} />
        ) : (
          <React.Fragment>
            {tab === 'home' && (
              <HomeView
                workouts={workouts}
                level={level}
                onLevelChange={handleLevelChange}
                focusMode={focusMode}
                onToggleFocus={handleToggleFocus}
                onOpenCollection={()=>setView('collection')}
                onOpenProfile={()=>setActiveModal('profile')}
                onOpenBackup={()=>setActiveModal('backup')}
                onStart={(r)=>{ setSelectedRoutine(r); setView('session'); }}
                onPickRoutine={()=>setView('picker')}
              />
            )}
            {tab === 'history' && (
              <HistoryView workouts={workouts} onDelete={handleDeleteWorkout} onUpdate={handleUpdateWorkout} />
            )}
            {tab === 'library' && (
              <LibraryView
                level={level}
                onLevelChange={handleLevelChange}
                customExercises={customExercises}
                favorites={favorites}
                onToggleFavorite={handleToggleFavorite}
                onAddCustom={handleAddCustomExercise}
                onDeleteCustom={handleDeleteCustomExercise}
              />
            )}
          </React.Fragment>
        )}
      </main>

      {view !== 'session' && <BottomNav tab={tab} setTab={(t)=>{ setTab(t); setView('home'); }} />}

      {activeModal === 'backup' && (
        <BackupModal
          exportData={exportPayload}
          onImport={handleImportData}
          onClose={()=>setActiveModal(null)}
        />
      )}

      {activeModal === 'profile' && (
        <ProfileModal
          profile={profile}
          onClose={()=>setActiveModal(null)}
          onSave={(p)=>{ setProfile(p); persistProfile(p); setActiveModal(null); }}
        />
      )}

      {unlockedMilestone && (
        <MilestoneRevealOverlay
          milestone={unlockedMilestone}
          onClose={()=>setUnlockedMilestone(null)}
        />
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
